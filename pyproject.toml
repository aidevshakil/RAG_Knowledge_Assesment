[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-assistant"
version = "1.0.0"
description = "Adaptive RAG assistant with live document management and performance benchmarking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.36",
    "numpy>=1.26",
    "pandas>=2.2",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
chroma = ["chromadb>=0.5"]
faiss = ["faiss-cpu>=1.8"]
hf = ["sentence-transformers>=3.0"]
openai = ["openai>=1.30"]
groq = ["groq>=0.9"]
anthropic = ["anthropic>=0.34"]
web = ["beautifulsoup4>=4.12"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
